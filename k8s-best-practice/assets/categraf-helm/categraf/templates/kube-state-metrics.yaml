{{- if .Values.kubeStateMetrics.enabled }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "categraf.resourceName" (dict "root" . "suffix" "kube-state-metrics") }}
  namespace: {{ include "categraf.namespace" . }}
  labels:
    {{- include "categraf.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "categraf.clusterResourceName" (dict "root" . "suffix" "kube-state-metrics") }}
  labels:
    {{- include "categraf.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources:
      - configmaps
      - secrets
      - nodes
      - pods
      - services
      - serviceaccounts
      - resourcequotas
      - limitranges
      - persistentvolumeclaims
      - persistentvolumes
      - namespaces
      - endpoints
    verbs: ["list", "watch"]
  - apiGroups: ["apps"]
    resources:
      - statefulsets
      - daemonsets
      - deployments
      - replicasets
    verbs: ["list", "watch"]
  - apiGroups: ["batch"]
    resources:
      - cronjobs
      - jobs
    verbs: ["list", "watch"]
  - apiGroups: ["autoscaling"]
    resources:
      - horizontalpodautoscalers
    verbs: ["list", "watch"]
  - apiGroups: ["policy"]
    resources:
      - poddisruptionbudgets
    verbs: ["list", "watch"]
  - apiGroups: ["storage.k8s.io"]
    resources:
      - storageclasses
      - volumeattachments
    verbs: ["list", "watch"]
  - apiGroups: ["networking.k8s.io"]
    resources:
      - networkpolicies
      - ingressclasses
      - ingresses
    verbs: ["list", "watch"]
  - apiGroups: ["coordination.k8s.io"]
    resources:
      - leases
    verbs: ["list", "watch"]
  - apiGroups: ["admissionregistration.k8s.io"]
    resources:
      - mutatingwebhookconfigurations
      - validatingwebhookconfigurations
    verbs: ["list", "watch"]
  - apiGroups: ["discovery.k8s.io"]
    resources:
      - endpointslices
    verbs: ["list", "watch"]
  - apiGroups: ["certificates.k8s.io"]
    resources:
      - certificatesigningrequests
    verbs: ["list", "watch"]
  - apiGroups: [""]
    resources:
      - replicationcontrollers
    verbs: ["list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "categraf.clusterResourceName" (dict "root" . "suffix" "kube-state-metrics") }}
  labels:
    {{- include "categraf.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "categraf.clusterResourceName" (dict "root" . "suffix" "kube-state-metrics") }}
subjects:
  - kind: ServiceAccount
    name: {{ include "categraf.resourceName" (dict "root" . "suffix" "kube-state-metrics") }}
    namespace: {{ include "categraf.namespace" . }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "categraf.resourceName" (dict "root" . "suffix" "kube-state-metrics") }}
  namespace: {{ include "categraf.namespace" . }}
  labels:
    {{- include "categraf.labels" . | nindent 4 }}
    app.kubernetes.io/name: kube-state-metrics
spec:
  clusterIP: None
  ports:
    - name: http-metrics
      port: 8080
      targetPort: http-metrics
  selector:
    app.kubernetes.io/name: kube-state-metrics
    app.kubernetes.io/instance: {{ .Release.Name }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "categraf.resourceName" (dict "root" . "suffix" "kube-state-metrics") }}
  namespace: {{ include "categraf.namespace" . }}
  labels:
    {{- include "categraf.labels" . | nindent 4 }}
    app.kubernetes.io/name: kube-state-metrics
spec:
  replicas: {{ .Values.kubeStateMetrics.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: kube-state-metrics
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kube-state-metrics
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      serviceAccountName: {{ include "categraf.resourceName" (dict "root" . "suffix" "kube-state-metrics") }}
      containers:
        - image: "{{ .Values.kubeStateMetrics.image }}"
          imagePullPolicy: {{ .Values.kubeStateMetrics.pullPolicy }}
          name: kube-state-metrics
          ports:
            - containerPort: 8080
              name: http-metrics
          resources:
            {{- toYaml .Values.kubeStateMetrics.resources | nindent 12 }}
{{- end }}
