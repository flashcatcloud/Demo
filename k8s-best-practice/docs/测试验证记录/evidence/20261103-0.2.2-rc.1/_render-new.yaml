# Source: categraf/templates/node-categraf.yaml
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: t
  namespace: default
  labels:
    app: n9e
    component: categraf
    helm.sh/chart: NORM
    app.kubernetes.io/instance: t
    app.kubernetes.io/version: NORM
    app.kubernetes.io/managed-by: Helm
spec:
  selector:
    matchLabels:
      app: n9e
      component: categraf
      app.kubernetes.io/instance: t
  template:
    metadata:
      labels:
        app: n9e
        component: categraf
        app.kubernetes.io/instance: t
      annotations:
        checksum/config: NORM
    spec:
      serviceAccountName: t
      hostNetwork: true
      hostPID: true
      dnsPolicy: ClusterFirstWithHostNet
      tolerations:
        - effect: NoSchedule
          operator: Exists
      containers:
      - name: categraf
        image: "registry.flashcat.cloud/public/categraf_ent:servicemap-v0.5.32"
        imagePullPolicy: IfNotPresent
        command: ["/usr/bin/categraf"]
        args: ["-configs", "/opt/categraf/conf"]
        securityContext:
          privileged: true
        resources:
          limits:
            cpu: 2000m
            memory: 2Gi
          requests:
            cpu: 200m
            memory: 512Mi
        env:
        - name: TZ
          value: Asia/Shanghai
        - name: HOSTNAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        - name: HOSTIP
          valueFrom:
            fieldRef:
              fieldPath: status.hostIP
        - name: CLUSTER_NAME
          value: "k8s-flashcat-test-20261029"
        - name: HOST_PROC
          value: /hostfs/proc
        - name: HOST_SYS
          value: /hostfs/sys
        - name: HOST_MOUNT_PREFIX
          value: /hostfs
        - name: CATEGRAF_HOST_EXEC_PROFILE
          value: "true"
        volumeMounts:
        - mountPath: /opt/categraf/conf/config.toml
          name: categraf-config
          subPath: config.toml
        - mountPath: /opt/categraf/conf/input.prometheus/cadvisor.toml
          name: categraf-input-cadvisor
          subPath: cadvisor.toml
