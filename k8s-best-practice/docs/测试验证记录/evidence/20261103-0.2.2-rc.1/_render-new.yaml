# Source: categraf/templates/ksm-categraf.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: t-ksm-scrape
  namespace: default
  labels:
    helm.sh/chart: NORM
    app.kubernetes.io/instance: t
    app.kubernetes.io/version: NORM
    app.kubernetes.io/managed-by: Helm
data:
  cluster-scrape.yaml: |
    global:
      scrape_interval: 15s
      external_labels:
        cluster: "k8s-flashcat-test-20261029"
        environment: "test"
        owner: "platform"
        
    scrape_configs:
      - job_name: 'kube-state-metrics'
        kubernetes_sd_configs:
          - role: endpoints
        relabel_configs:
          - source_labels: [__meta_kubernetes_namespace, __meta_kubernetes_service_name, __meta_kubernetes_endpoint_port_name]
            action: keep
            regex: default;t-kube-state-metrics;http-metrics
      - job_name: 'app-metrics'
        metrics_path: /metrics
        kubernetes_sd_configs:
          - role: pod
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
            action: keep
            regex: "true"
          - source_labels: [__meta_kubernetes_namespace]
            target_label: namespace
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod
          - source_labels: [__meta_kubernetes_pod_label_app]
            target_label: service
            regex: ^(.+)$
            replacement: $1
          - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name]
            target_label: service
            regex: ^(.+)$
            replacement: $1
          - source_labels: [__meta_kubernetes_pod_label_team]
            target_label: team
            regex: ^(.+)$
            replacement: $1
          - source_labels: [__meta_kubernetes_pod_ip, __meta_kubernetes_pod_annotation_prometheus_io_port]
            target_label: __address__
            regex: (.+);(\d+)
            replacement: "${1}:${2}"
          - target_label: __metrics_path__
            replacement: "/metrics"
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
            target_label: __metrics_path__
            regex: ^(.+)$
            replacement: $1
          - target_label: __scheme__
            replacement: http
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scheme]
            target_label: __scheme__
            regex: ^(https?)$
            replacement: $1
      - job_name: 'coredns'
        kubernetes_sd_configs:
          - role: endpoints
        relabel_configs:
          - source_labels: [__meta_kubernetes_namespace, __meta_kubernetes_service_name, __meta_kubernetes_endpoint_port_name]
            action: keep
            regex: kube-system;(coredns|kube-dns);metrics
      - job_name: 'calico'
        kubernetes_sd_configs:
          - role: pod
        relabel_configs:
          - source_labels: [__meta_kubernetes_namespace, __meta_kubernetes_pod_label_k8s_app]
            action: keep
            regex: kube-system;calico-node
          - source_labels: [__meta_kubernetes_pod_ip]
            action: replace
            target_label: __address__
            replacement: ${1}:9091
      - job_name: 'cilium'
        kubernetes_sd_configs:
          - role: pod
        relabel_configs:
          - source_labels: [__meta_kubernetes_namespace, __meta_kubernetes_pod_label_app_kubernetes_io_name]
            action: keep
            regex: kube-system;cilium
          - source_labels: [__meta_kubernetes_pod_ip]
            action: replace
            target_label: __address__
            replacement: ${1}:9090
    remote_write:
      - url: 'http://192.168.31.14:19000/prometheus/v1/write'
        basic_auth:
          username: "user001"
          password: ""
