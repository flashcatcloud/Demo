        component: operator
        app.kubernetes.io/instance: t
      annotations:
        checksum/config: NORM
    spec:
      serviceAccountName: t-operator
      containers:
      - name: operator
        image: "registry.flashcat.cloud/public/categraf-operator:0.0.7"
        imagePullPolicy: IfNotPresent
        args:
        - --leader-elect=true
        ports:
        - containerPort: 8080
          name: metrics
          protocol: TCP
        - containerPort: 8081
          name: health
          protocol: TCP
        envFrom:
        - configMapRef:
